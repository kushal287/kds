# Render Blueprint — https://render.com/docs/blueprint-spec
# FREE plan. Render's free disk is wiped on every restart, so the site saves your content
# (db.json + uploaded images) in a private GitHub "data" repo instead — see DEPLOY-RENDER.md.
services:
  - type: web
    name: kds-website
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: node server.js
    healthCheckPath: /healthz
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      # --- set these in the Render dashboard (values are never stored in Git) ---
      - key: ADMIN_PASSWORD        # your admin login password
        sync: false
      - key: GH_DATA_REPO          # e.g. kushal287/kds-data  (PRIVATE repo)
        sync: false
      - key: GH_TOKEN              # fine-grained GitHub token: Contents read/write on that repo only
        sync: false
      - key: KDS_WEBHOOK_URL       # optional: Google Apps Script web-app URL (…/exec)
        sync: false
      - key: KDS_WEBHOOK_SECRET    # optional: the SECRET from your Apps Script
        sync: false
